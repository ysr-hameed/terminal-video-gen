theme: auto
voice: "en-IN-PrabhatNeural"

steps:
  - type: hook
    title: "Stop using weak passwords"
    sub: "Fix it in 60 seconds"
    narration: "Stop scrolling! Weak passwords? Fix in sixty seconds — watch!"

  - narration: "First, check Python."
    command: "python3 --version"

  - narration: "Make vault — mkdir makes a folder."
    command: "mkdir vault"

  - narration: "Enter it — cd changes directory."
    command: "cd vault"

  - narration: "Empty — ls shows nothing."
    command: "ls"

  - type: explain
    file: "vault/passgen.py"
    intro: "Watch it type, quick explain."
    code: |
      import secrets, string

      def gen(length=16):
          chars = string.ascii_letters + string.digits + "!@#$%^&*"
          return "".join(secrets.choice(chars) for _ in range(length))

      for i in range(5):
          print(f"Password {i+1}: {gen()}")
    lines:
      - line: 1
        say: "Import secrets — secure random."
      - line: 3
        say: "gen makes a password, length given."
      - line: 4
        say: "Mix letters, digits, symbols."
      - line: 5
        say: "Pick random chars and join."
      - line: 7
        say: "Loop five times."
      - line: 8
        say: "Print each password."

  - narration: "Now run it."
    command: "python3 passgen.py"

  - narration: "Follow for more!"
    command: "echo Follow  •  Subscribe!"
